services:
  web:
    image: httpd:2.4-alpine
    container_name: eyedrops-timer-web
    ports:
      - "8080:80"
    environment:
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
    volumes:
      # 開発時は public をマウントして即時反映
      - ./public:/usr/local/apache2/htdocs
    command:
      - /bin/sh
      - -c
      - |
        printf '// .env から自動生成される環境設定（手動編集不要）\nwindow.__EYEDROPS_ENV__ = {\n  "GOOGLE_CLIENT_ID": "%s"\n};\n' "$$GOOGLE_CLIENT_ID" > /usr/local/apache2/htdocs/js/env.js
        exec httpd-foreground
    restart: unless-stopped
