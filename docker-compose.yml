# 本番・標準の Docker Compose 設定（イメージ内包ファイルで配信）
services:
  web:
    build: .
    image: eyedrops-timer-web:latest
    container_name: eyedrops-timer-web
    ports:
      - "${EYEDROPS_BIND_IP:-0.0.0.0}:${EYEDROPS_PORT:-8080}:80"
    environment:
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
